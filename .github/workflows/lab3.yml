name: Lab3 EF Core SQLite verification
on:
  push:
    branches: [lab3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab3-verify
  cancel-in-progress: true

jobs:
  build-test-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python report dependencies
        run: python -m pip install --quiet reportlab pillow

      - name: Restore
        run: dotnet restore MusicContest.sln

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build MusicContest.sln --no-restore -c Release 2>&1 | tee docs/Lab3_build.txt

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test MusicContest.sln --no-build -c Release 2>&1 | tee docs/Lab3_test.txt

      - name: Run EF migration and database CRUD demonstration
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project MusicContest.Console -c Release --no-build -- --lab3-only 2>&1 | tee docs/Lab3_output.txt

      - name: Generate genuine SQLite table views and PDF
        run: python scripts/generate_lab3_report.py

      - name: Publish generated SQLite, console logs and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/musiccontest.db docs/Lab3_build.txt docs/Lab3_test.txt docs/Lab3_output.txt docs/Lab3_*.png docs/Lab3_Report.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(lab3): verified SQLite database and PDF report [skip ci]"
            git push origin HEAD:lab3
          fi
